# PIA's vetted source catalogue. Read by src/pia/store/seed.py.
#
# Every RSS entry here was fetched and checked on 2026-11-15: HTTP 200, a real feed, at least three entries, the
# newest within 90 days. `tier = "core"` sources are switched on when the database is first seeded; `optional`
# ones are seeded as CANDIDATES, i.e. recommendations on the Sources page that you can accept or reject.
# High-volume general news, aggregators and opportunity listings are deliberately optional.
#
# Seeding only ADDS sources that are missing (matched by name). Pausing, removing or re-tuning a source in the
# app is never undone by this file. See docs/platform/SOURCES.md for coverage, reliability and known gaps.

# ---------- APIs (the adapters v1 proved) ----------

[[source]]
name = "Hacker News"
kind = "hn"
homepage = "https://news.ycombinator.com"
description = "Stories that reached 150 points on Hacker News."
domains = ["software", "ai", "startups"]
tier = "core"
trust = 0.6
interval = 60
general = true
config = { min_points = 150, max_results = 100 }

