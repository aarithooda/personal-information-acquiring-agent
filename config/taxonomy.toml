# The information spaces PIA starts with, and the vocabulary used to sort items into them WITHOUT a model.
#
# This file only SEEDS the database (on first run, and when new entries are added here later). After that the
# database is the source of truth: domains and topics can be added, renamed, weighted or muted in the app.
#
#   keywords  phrases that suggest an item belongs to the domain (whole-word match, case-insensitive).
#             A hit in the title counts more than a hit in the text.
#   arxiv     arXiv category prefixes that map to the domain.
#   topics    seed topics, written "Name | alias | alias". Names and aliases are matched as whole phrases.
#
# Personal details (which university, which topics matter most) do NOT belong here; see config/personal.example.toml.

